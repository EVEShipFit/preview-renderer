name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: github.event_name != 'push'
        run: |
          docker run -d --name renderer -p 8080:8080 "$(head -n1 <<< "$TAGS")"
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          status=$(curl -s -o og.png -w "%{http_code}" "localhost:8080/og.png?fit=esf1:CgUIARDLBA")
          if [ "$status" != 200 ] || ! file og.png | grep -q PNG; then
            echo "::error::Got $status"
            cat og.png
            docker logs renderer
            exit 1
          fi
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
